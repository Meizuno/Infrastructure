# Application services. Deployed with zero downtime via `docker rollout`
# (see scripts/deploy.sh) — so they MUST NOT declare `container_name:` or
# `ports:`; rollout transiently runs 2 replicas behind Traefik.
# Assembled into the `meizuno` project via compose.yaml (include:).
# postgres + the networks live in compose.infra.yaml; depends_on resolves
# across the merged project.

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [edge, internal]
  depends_on:
    postgres:
      condition: service_healthy

services:
  authentication:
    <<: *app-defaults
    image: ghcr.io/meizuno/authentication:latest
    environment:
      PORT: 8080
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/authentication?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://auth.meizuno.com/google/callback
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      # Exact-match allow-list for each app's post-login redirect (open-redirect guard)
      ALLOWED_REDIRECT_URLS: https://chat.meizuno.com/api/auth/callback,https://money.meizuno.com/api/auth/callback,https://recipes.meizuno.com/api/auth/callback,https://notes.meizuno.com/api/auth/callback
      # Issue the access/refresh cookies on the parent domain so one sign-in
      # is shared across every *.meizuno.com app.
      COOKIE_DOMAIN: .meizuno.com
      GIN_MODE: release
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.meizuno.com`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  ai-chat:
    <<: *app-defaults
    image: ghcr.io/meizuno/ai-chat:latest
    environment:
      NUXT_OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Split auth URLs: server-to-server stays internal (no hairpin), the
      # browser OAuth flow uses the public auth origin.
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_AUTH_PUBLIC_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
    volumes:
      - ./config/ai-chat.yml:/app/config.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai-chat.rule=Host(`chat.meizuno.com`)
      - traefik.http.routers.ai-chat.entrypoints=web
      - traefik.http.services.ai-chat.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  money-manager:
    <<: *app-defaults
    image: ghcr.io/meizuno/money-manager:latest
    environment:
      # Split auth URLs: server-to-server stays internal (no hairpin), the
      # browser OAuth flow uses the public auth origin.
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_AUTH_PUBLIC_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
      NUXT_DATABASE_URL: postgres://money_user:${MONEY_DB_PASSWORD}@postgres:5432/money_manager?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.money-manager.rule=Host(`money.meizuno.com`)
      - traefik.http.routers.money-manager.entrypoints=web
      - traefik.http.services.money-manager.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  recipes-book:
    <<: *app-defaults
    image: ghcr.io/meizuno/recipes-book:latest
    environment:
      # Split auth URLs: server-to-server stays internal (no hairpin), the
      # browser OAuth flow uses the public auth origin.
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_AUTH_PUBLIC_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
      NUXT_DATABASE_URL: postgres://recipes_user:${RECIPES_DB_PASSWORD}@postgres:5432/recipes_book?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.recipes-book.rule=Host(`recipes.meizuno.com`)
      - traefik.http.routers.recipes-book.entrypoints=web
      - traefik.http.services.recipes-book.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  notes:
    <<: *app-defaults
    image: ghcr.io/meizuno/notes:latest
    environment:
      NUXT_AUTH_SERVICE_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
      NUXT_DATABASE_URL: postgres://notes_user:${NOTES_DB_PASSWORD}@postgres:5432/notes?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.notes.rule=Host(`notes.meizuno.com`)
      - traefik.http.routers.notes.entrypoints=web
      - traefik.http.services.notes.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
