# Application services. Deployed with zero downtime via `docker rollout`
# (see scripts/deploy.sh) — so they MUST NOT declare `container_name:` or
# `ports:`; rollout transiently runs 2 replicas behind Traefik.
# Assembled into the `meizuno` project via compose.yaml (include:).
# postgres + the networks live in compose.infra.yaml; depends_on resolves
# across the merged project.

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [edge, internal]
  depends_on:
    postgres:
      condition: service_healthy

# Nuxt apps share the same readiness probe (/api/health on :3000). A short
# start_period/interval makes `healthy` reachable within a few seconds, so
# `docker rollout` has a real health signal to wait on before cutting over.
x-nuxt-defaults: &nuxt-defaults
  <<: *app-defaults
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
    interval: 3s
    timeout: 2s
    retries: 3
    start_period: 3s

services:
  authentication:
    <<: *app-defaults
    image: ghcr.io/meizuno/authentication:latest
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 3s
    environment:
      PORT: 8080
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/authentication?sslmode=disable
      # Access tokens are signed with EdDSA (asymmetric). The private key is
      # mounted as a file secret (never an env value) and the public half is
      # published at /.well-known/jwks.json. JWT_SECRET is kept ONLY to verify
      # in-flight HS256 tokens during the cutover window — blank it in .env and
      # redeploy once they have expired (≤15 min). See README → "Token signing".
      JWT_SIGNING_ALG: EdDSA
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      # Verification-only previous public keys for a seamless key rotation overlap
      # (empty in steady state; filled briefly by scripts/rotate-jwt-key.sh).
      JWT_PREVIOUS_PUBLIC_KEYS_FILE: /run/secrets/jwt_previous_public_keys
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://auth.meizuno.com/google/callback
      # Allowed login emails and post-login redirect URLs are managed at runtime
      # in the admin console (auth.meizuno.com/admin), not here. ALLOWED_EMAILS /
      # ALLOWED_REDIRECT_URLS still work as an env break-glass floor if ever set.
      # Emails granted the admin role (the bootstrap admin set; synced on login).
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Issue the access/refresh cookies on the parent domain so one sign-in
      # is shared across every *.meizuno.com app.
      COOKIE_DOMAIN: .meizuno.com
      GIN_MODE: release
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.meizuno.com`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8080
      - traefik.http.services.auth.loadbalancer.healthcheck.path=/health
      - traefik.http.services.auth.loadbalancer.healthcheck.interval=3s
      - traefik.http.services.auth.loadbalancer.healthcheck.timeout=2s
    secrets:
      - jwt_private_key
      - jwt_previous_public_keys
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  ai-chat:
    <<: *nuxt-defaults
    image: ghcr.io/meizuno/ai-chat:latest
    environment:
      NUXT_OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Split auth URLs: server-to-server stays internal (no hairpin), the
      # browser OAuth flow uses the public auth origin.
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_AUTH_PUBLIC_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
    volumes:
      - ./config/ai-chat.yml:/app/config.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai-chat.rule=Host(`chat.meizuno.com`)
      - traefik.http.routers.ai-chat.entrypoints=web
      - traefik.http.services.ai-chat.loadbalancer.server.port=3000
      - traefik.http.services.ai-chat.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.ai-chat.loadbalancer.healthcheck.interval=3s
      - traefik.http.services.ai-chat.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  money-manager:
    <<: *nuxt-defaults
    image: ghcr.io/meizuno/money-manager:latest
    environment:
      # Split auth URLs: server-to-server stays internal (no hairpin), the
      # browser OAuth flow uses the public auth origin.
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_AUTH_PUBLIC_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
      NUXT_DATABASE_URL: postgres://money_user:${MONEY_DB_PASSWORD}@postgres:5432/money_manager?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.money-manager.rule=Host(`money.meizuno.com`)
      - traefik.http.routers.money-manager.entrypoints=web
      - traefik.http.services.money-manager.loadbalancer.server.port=3000
      - traefik.http.services.money-manager.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.money-manager.loadbalancer.healthcheck.interval=3s
      - traefik.http.services.money-manager.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  recipes-book:
    <<: *nuxt-defaults
    image: ghcr.io/meizuno/recipes-book:latest
    environment:
      # Split auth URLs: server-to-server stays internal (no hairpin), the
      # browser OAuth flow uses the public auth origin.
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_AUTH_PUBLIC_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
      NUXT_DATABASE_URL: postgres://recipes_user:${RECIPES_DB_PASSWORD}@postgres:5432/recipes_book?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.recipes-book.rule=Host(`recipes.meizuno.com`)
      - traefik.http.routers.recipes-book.entrypoints=web
      - traefik.http.services.recipes-book.loadbalancer.server.port=3000
      - traefik.http.services.recipes-book.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.recipes-book.loadbalancer.healthcheck.interval=3s
      - traefik.http.services.recipes-book.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  notes:
    <<: *nuxt-defaults
    image: ghcr.io/meizuno/notes:latest
    environment:
      NUXT_AUTH_SERVICE_URL: https://auth.meizuno.com
      NUXT_COOKIE_DOMAIN: .meizuno.com
      NUXT_DATABASE_URL: postgres://notes_user:${NOTES_DB_PASSWORD}@postgres:5432/notes?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.notes.rule=Host(`notes.meizuno.com`)
      - traefik.http.routers.notes.entrypoints=web
      - traefik.http.services.notes.loadbalancer.server.port=3000
      - traefik.http.services.notes.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.notes.loadbalancer.healthcheck.interval=3s
      - traefik.http.services.notes.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  calories:
    <<: *app-defaults
    image: ghcr.io/meizuno/calories:latest
    environment:
      PORT: 8080
      DATABASE_URL: postgres://calories_user:${CALORIES_DB_PASSWORD}@postgres:5432/calories?sslmode=disable
      # Server-to-server token validation stays internal (no hairpin); the browser
      # OAuth login uses the public auth origin. Logout is proxied via /api/logout.
      AUTH_VALIDATE_URL: http://authentication:8080/validate
      AUTH_REFRESH_URL: http://authentication:8080/refresh
      AUTH_LOGIN_URL: https://auth.meizuno.com/google
      AUTH_LOGOUT_URL: https://auth.meizuno.com/logout
      COOKIE_DOMAIN: .meizuno.com
    labels:
      - traefik.enable=true
      - traefik.http.routers.calories.rule=Host(`calories.meizuno.com`)
      - traefik.http.routers.calories.entrypoints=web
      - traefik.http.services.calories.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal

# File-based secrets bind-mounted to /run/secrets/<name> in the target service.
# The source files live on the host under secrets/ (gitignored) — generate the
# signing key with scripts/gen-jwt-key.sh before the first `docker compose up`.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  # Public keys (not secret) of just-retired signing keys, mounted for a rotation
  # overlap. Empty in steady state; managed by scripts/rotate-jwt-key.sh.
  jwt_previous_public_keys:
    file: ./secrets/jwt_previous_public_keys.pem
