# Infrastructure: ingress, data, monitoring, logs. Single-instance services
# (not rolled) — they keep fixed container_name; vector/victoria-logs REQUIRE
# their exact names for vector.yaml's exclude_containers.
# Assembled into the `meizuno` project via compose.yaml (include:).

services:
  # ── Ingress ────────────────────────────────────────────────────────────────
  traefik:
    # v3.6+ negotiates the Docker API version. Older Traefik defaulted to API
    # 1.24, which Docker Engine 28+ rejects ("client version 1.24 is too old").
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks: [edge]
    labels:
      - traefik.enable=true
      # Dashboard. Access control is at the edge via Cloudflare Access (Zero
      # Trust); Traefik has no dashboard auth of its own — the tunnel + Access
      # is the gate (same as the logs UI).
      - traefik.http.routers.dashboard.rule=Host(`traefik.meizuno.com`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cloudflared:
    # Pinned (was :latest) so `deploy.sh` (pull + up -d) doesn't recreate the
    # tunnel on every app deploy — a restart drops in-flight requests with
    # "context canceled". Bump deliberately.
    image: cloudflare/cloudflared:2026.7.2
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [edge]
    depends_on: [traefik]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # ── Data ─────────────────────────────────────────────────────────────────-─
  postgres:
    image: postgres:18.4-bookworm
    container_name: postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=2GB
      -c max_connections=100
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SUPERUSER}
      # consumed by ./postgres/init on a FRESH volume to create the per-app
      # login roles + their databases (existing DBs: scripts/migrate-db-roles.sh)
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      MONEY_DB_PASSWORD: ${MONEY_DB_PASSWORD}
      RECIPES_DB_PASSWORD: ${RECIPES_DB_PASSWORD}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD}
    volumes:
      # PG18 stores data at $PGDATA=/var/lib/postgresql/18/docker and declares
      # the VOLUME at /var/lib/postgresql — mount there, NOT at .../data.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3g

  # ── Monitoring ───────────────────────────────────────────────────────────--─
  kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - kuma-data:/app/data
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.meizuno.com`)
      - traefik.http.routers.kuma.entrypoints=web
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Server metrics (CPU / RAM / disk) ───────────────────────────────────────
  # Beszel hub (UI + store) plus its local agent. The agent connects OUT to the
  # hub over the edge network (HUB_URL) and authenticates with KEY + TOKEN. On
  # first run: open the hub, create the admin account, "Add System" (host/port
  # are irrelevant in this mode), then copy the shown KEY + TOKEN into secrets
  # (BESZEL_KEY / BESZEL_TOKEN) and redeploy the agent.
  beszel:
    image: henrygd/beszel:0.18.7
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://beszel.meizuno.com
    volumes:
      - beszel-data:/beszel_data
    networks: [edge]
    labels:
      - traefik.enable=true
      # Beszel has its own login (+ optional MFA), so it's served through the
      # tunnel like the other UIs. Add a Cloudflare Access app in front for an
      # extra edge gate if wanted.
      - traefik.http.routers.beszel.rule=Host(`beszel.meizuno.com`)
      - traefik.http.routers.beszel.entrypoints=web
      - traefik.http.services.beszel.loadbalancer.server.port=8090
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    container_name: beszel-agent
    restart: unless-stopped
    # WebSocket mode: the agent dials the hub over the edge network (HUB_URL) and
    # authenticates with KEY + TOKEN — no listening socket, no port, no socket
    # permissions to align. CPU/RAM come from the shared kernel and disk from the
    # /host bind; only host-NIC bandwidth stats differ vs network_mode: host.
    environment:
      HUB_URL: http://beszel:8090            # internal — same edge network as the hub
      KEY: ${BESZEL_KEY}                     # hub public key — from the hub UI on first run
      TOKEN: ${BESZEL_TOKEN}                 # system token — from the hub UI on first run
      FILESYSTEM: /host                      # statfs the bind-mounted host root for disk %
    networks: [edge]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # per-container stats
      - beszel-agent-data:/var/lib/beszel-agent
      - /:/host:ro                                       # host root, read-only, for disk usage
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── Dashboard (single pane: links + host resources + status) ────────────────
  # Homepage — one page with host CPU/RAM/disk, per-container stats, app up/down
  # and links. No built-in auth, so gate it at the edge with Cloudflare Access
  # (like the Traefik/logs UIs). Config is committed under ./homepage.
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.meizuno.com   # required — the Host it's served on
    volumes:
      - ./homepage:/app/config                          # dashboard config (committed)
      - /var/run/docker.sock:/var/run/docker.sock:ro    # per-container stats
      - /:/host:ro                                        # host root for the disk widget
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.meizuno.com`)
      - traefik.http.routers.homepage.entrypoints=web
      - traefik.http.services.homepage.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Observability (centralized logs) ────────────────────────────────────────
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.51.0
    container_name: victoria-logs
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=30d        # storage-level rotation
    volumes:
      - vlogs-data:/vlogs
    networks: [logs, edge]
    labels:
      - traefik.enable=true
      # Access control is handled at the edge by Cloudflare Access (Zero Trust);
      # VictoriaLogs has no built-in auth, so the tunnel + Access is the gate.
      - traefik.http.routers.logs.rule=Host(`logs.meizuno.com`)
      - traefik.http.routers.logs.entrypoints=web
      - traefik.http.routers.logs.service=logs
      - traefik.http.services.logs.loadbalancer.server.port=9428
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  vector:
    image: timberio/vector:0.56.0-alpine
    container_name: vector
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
    networks: [logs]
    depends_on: [victoria-logs]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
  logs:
    name: meizuno_logs

volumes:
  postgres-data:
    name: meizuno_postgres-data
  kuma-data:
    name: meizuno_kuma-data
  vlogs-data:
    name: meizuno_vlogs-data
  beszel-data:
    name: meizuno_beszel-data
  beszel-agent-data:
    name: meizuno_beszel-agent-data
