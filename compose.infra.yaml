# Infrastructure: ingress, data, monitoring. Single-instance services (not
# rolled) — they keep fixed container_name.
#
# Uptime Kuma is what is left of the old monitoring stack: it stays as the
# alerting layer (it also receives the backup push from scripts/backup-db.sh).
# Beszel, Homepage, VictoriaLogs and Vector were removed — Grafana replaces
# them; see README → Monitoring.
# Assembled into the `meizuno` project via compose.yaml (include:).

services:
  # ── Ingress ────────────────────────────────────────────────────────────────
  traefik:
    # v3.6+ negotiates the Docker API version. Older Traefik defaulted to API
    # 1.24, which Docker Engine 28+ rejects ("client version 1.24 is too old").
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks: [edge]
    labels:
      - traefik.enable=true
      # Dashboard. Access control is at the edge via Cloudflare Access (Zero
      # Trust); Traefik has no dashboard auth of its own — the tunnel + Access
      # is the gate (same as the logs UI).
      - traefik.http.routers.dashboard.rule=Host(`traefik.meizuno.com`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cloudflared:
    # Pinned (was :latest) so a deploy (pull + up -d) doesn't recreate the
    # tunnel on every app deploy — a restart drops in-flight requests with
    # "context canceled". Bump deliberately.
    image: cloudflare/cloudflared:2026.7.2
    container_name: cloudflared
    restart: unless-stopped
    # --metrics exposes /metrics on :2000 inside the edge network (nothing is
    # published to the host) for victoria-metrics: tunnel health, request
    # counts, and whether the edge connections are actually up.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # `tunnel` exists only so cloudflared can resolve the code-server sandbox by
    # name. cloudflared is a container, so a tunnel hostname pointing at
    # http://localhost:8080 hits ITS OWN loopback, not the host, and
    # code-server's port is published on 127.0.0.1 only — they have to share a
    # network. A dedicated one rather than `edge`, because putting the sandbox
    # on edge also hands it Traefik, every app, and a Grafana that runs with no
    # login at all. See the Code-Server repo's docker-compose.yml.
    networks: [edge, tunnel]
    depends_on: [traefik]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # ── Data ─────────────────────────────────────────────────────────────────-─
  # shared_preload_libraries is a postmaster-level setting, so changing the
  # command here RESTARTS Postgres and every app briefly loses its connections.
  # It is what postgres-exporter's stat_statements collector needs; the
  # extension itself still has to be created once, in the maintenance database
  # the exporter connects to:
  #   docker compose exec -T postgres psql -U admin -d admin \
  #     -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'
  postgres:
    image: postgres:18.4-bookworm
    container_name: postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=2GB
      -c max_connections=100
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c pg_stat_statements.track=top
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SUPERUSER}
      # consumed by ./postgres/init on a FRESH volume to create the per-app
      # login roles + their databases (existing DBs: scripts/migrate-db-roles.sh)
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      MONEY_DB_PASSWORD: ${MONEY_DB_PASSWORD}
      RECIPES_DB_PASSWORD: ${RECIPES_DB_PASSWORD}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD}
    volumes:
      # PG18 stores data at $PGDATA=/var/lib/postgresql/18/docker and declares
      # the VOLUME at /var/lib/postgresql — mount there, NOT at .../data.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3g

  redis:
    # Pinned like the other infra images so an app deploy never silently swaps
    # the Redis version (Redis 8.x is OSI-licensed again). Bump deliberately —
    # confirm the exact tag exists before deploying.
    image: redis:8.2-alpine
    container_name: redis
    restart: unless-stopped
    # requirepass even on the internal-only network (defence in depth, like
    # postgres). appendonly = durable across restarts; maxmemory sits under the
    # container limit so Redis stays inside its cgroup instead of being OOM-
    # killed, and noeviction keeps it a safe general store (it errors on writes
    # at the cap rather than dropping keys). For a pure CACHE instead, switch to
    # `--maxmemory-policy allkeys-lru` and you can drop `--appendonly yes`.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 384mb
      --maxmemory-policy noeviction
    environment:
      # exposed only so the healthcheck below can authenticate
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Monitoring ───────────────────────────────────────────────────────────--─
  kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - kuma-data:/app/data
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.meizuno.com`)
      - traefik.http.routers.kuma.entrypoints=web
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
  # Joined by cloudflared here and, as an external network, by the code-server
  # sandbox. Nothing else belongs on it.
  tunnel:
    name: meizuno_tunnel

volumes:
  postgres-data:
    name: meizuno_postgres-data
  redis-data:
    name: meizuno_redis-data
  kuma-data:
    name: meizuno_kuma-data
