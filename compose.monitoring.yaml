# Monitoring — Grafana and what feeds it. Single-instance infra services, so
# they keep fixed container_name and are deployed with `docker compose up -d`,
# never `docker rollout`.
#
#   grafana            — the only UI (grafana.meizuno.com), behind Cloudflare Access
#   kuma               — Uptime Kuma (status.meizuno.com): uptime checks, the
#                        backup's push monitor, and the alerts
#   victoria-metrics   — metrics store AND scraper (PromQL-compatible, one binary,
#                        so no separate Prometheus/vmagent)
#   loki + alloy       — logs: alloy tails every container via the docker socket,
#                        loki stores them; Loki 3.x tags each line with
#                        detected_level, so "show me warn+error" is one filter
#   pyroscope          — continuous profiling store, fed by the apps' SDKs
#   node-exporter      — host CPU / RAM / disk / network
#   postgres-exporter  — connections, DB sizes, slow queries, bloat
#   redis-exporter     — hit rate, memory, keys
#
# Traefik and cloudflared need no container here — both expose Prometheus
# metrics themselves; this file's companion edits switch them on
# (traefik/traefik.yml, and --metrics on cloudflared in compose.infra.yaml).
#
# PYROSCOPE: the server stores profiles, it does not collect them. Each app
# pushes its own with a Pyroscope SDK — today english and forma (Python,
# pyroscope-io), switched on by the PYROSCOPE_SERVER_ADDRESS in their compose
# files. An app without the SDK has no profiles. The alternative, alloy's eBPF
# profiler, needs `privileged: true` + `pid: host` — deliberately NOT set here,
# since it would widen the container boundary the README's security posture
# section is built around.
#
# Assembled into the `meizuno` project via compose.yaml (include:).

x-infra-defaults: &infra-defaults
  restart: unless-stopped

services:
  # ── UI ──────────────────────────────────────────────────────────────────────
  grafana:
    <<: *infra-defaults
    image: grafana/grafana:12.3.0
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.meizuno.com
      # NO Grafana login at all — Cloudflare Access is the ONLY gate, exactly
      # like code-server's `--auth none` and the Traefik/Kuma UIs. Anonymous
      # users get Admin, and the login form and basic auth are switched off so
      # there is no credential to guess or leak behind Access.
      #
      # THIS MAKES THE ACCESS APP LOAD-BEARING: anyone who reaches
      # grafana.meizuno.com is a full admin. Do not add the tunnel hostname
      # without an Access policy in front of it.
      #
      # Locked out if Access misbehaves? Flip GF_AUTH_DISABLE_LOGIN_FORM to
      # "false", set GF_SECURITY_ADMIN_PASSWORD, and restart to get the form
      # back.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Datasources come from ./grafana/provisioning (committed), not clicks.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Reads Uptime Kuma's own SQLite file for the overview's uptime row —
      # the status changes and their messages ("verify-failed-1") live only
      # there: Kuma's /metrics has no messages, and its log has neither the
      # recoveries nor anything about push monitors. Installed before Grafana
      # starts and kept in grafana-data; pinned, like every image here.
      GF_PLUGINS_PREINSTALL_SYNC: frser-sqlite-datasource@4.0.6
    # Nothing required today (no admin password with anonymous auth); kept so
    # SMTP or OAuth credentials can be added later without touching compose.
    env_file:
      - path: monitoring.env
        required: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Kuma's data, READ-ONLY. The datasource opens it with mode=ro as well;
      # SQLite reads a WAL database from a read-only mount as long as Kuma's
      # -wal and -shm files are there, which they are while Kuma runs.
      #
      # It is the whole of Kuma's database, notification settings included,
      # in front of anybody who can open Grafana — the same people as can open
      # Kuma, both being behind the one Access policy.
      - kuma-data:/var/lib/kuma:ro
    networks: [edge, monitoring]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.meizuno.com`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Metrics ─────────────────────────────────────────────────────────────────
  victoria-metrics:
    <<: *infra-defaults
    image: victoriametrics/victoria-metrics:v1.136.0
    container_name: victoria-metrics
    command:
      - -storageDataPath=/vmdata
      - -retentionPeriod=15d
      # Hard stop on writes while 2 GiB of disk is still free. The host sits at
      # 93% — this is what keeps a metrics blow-up from filling / and taking
      # Postgres down with it.
      - -storage.minFreeDiskSpaceBytes=2GB
      # VictoriaMetrics scrapes directly, so there is no Prometheus to run.
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.suppressScrapeErrors=false
      - -loggerLevel=WARN
    volumes:
      - vm-data:/vmdata
      - ./config/victoria-metrics-scrape.yml:/etc/vm/scrape.yml:ro
    # edge → scrape traefik + cloudflared; internal → the db exporters.
    networks: [monitoring, edge, internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  node-exporter:
    <<: *infra-defaults
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Only the real filesystems; skip docker's overlay churn.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|devtmpfs|overlay|squashfs|tmpfs)$$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Upstream suggests `:ro,rslave` so new mounts show up without a restart,
      # but rslave requires / to be a shared or slave mount — where it is not,
      # docker refuses to START the container ("path / is mounted on / but it
      # is not a shared or slave mount"). Plain :ro always works; the cost is
      # that adding a disk later needs `docker compose up -d node-exporter`.
      - /:/host/root:ro
      # Without this the diskstats collector logs an ERROR on every scrape
      # ("Failed to open directory, disabling udev device properties"), which
      # would show up as a permanent fake error in Loki.
      - /run/udev:/run/udev:ro
    networks: [monitoring]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  postgres-exporter:
    <<: *infra-defaults
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    # DATA_SOURCE_NAME carries a password, so it lives in monitoring.env.
    # The `monitoring` role needs pg_monitor plus CONNECT on each app database —
    # PUBLIC's CONNECT is revoked per database, so without the grants the
    # exporter only sees cluster-wide stats. See monitoring.env.example.
    env_file:
      - path: monitoring.env
        required: false
    # stat_statements needs BOTH halves in place or it fails on every scrape
    # with "function pg_stat_statements(boolean) does not exist":
    #   1. -c shared_preload_libraries=pg_stat_statements on postgres
    #      (compose.infra.yaml — a postmaster setting, so it restarts Postgres)
    #   2. CREATE EXTENSION pg_stat_statements in the `admin` database
    # The monitoring role can read it because pg_monitor carries
    # pg_read_all_stats, which is what exposes other roles' queries.
    command:
      - --collector.stat_statements
      - --collector.long_running_transactions
    networks: [monitoring, internal]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  redis-exporter:
    <<: *infra-defaults
    image: oliver006/redis_exporter:v1.95.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [monitoring, internal]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ── Logs ────────────────────────────────────────────────────────────────────
  loki:
    <<: *infra-defaults
    image: grafana/loki:3.6.1
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "10001:10001"          # the image's own uid; the volume is chowned to it
    volumes:
      - loki-data:/loki
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
    networks: [monitoring]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  alloy:
    <<: *infra-defaults
    image: grafana/alloy:v1.13.1
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
    networks: [monitoring]
    depends_on: [loki]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Uptime and alerting ─────────────────────────────────────────────────────
  # Uptime Kuma: every service checked on an interval, the backup's push
  # monitor (scripts/backup-db.sh), and the alerts. Grafana reads its database
  # for the overview's uptime row (see grafana above). Moved here from
  # compose.infra.yaml; same service name and container, so a deploy of this
  # file does not recreate it.
  kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - kuma-data:/app/data
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.meizuno.com`)
      - traefik.http.routers.kuma.entrypoints=web
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Profiling ───────────────────────────────────────────────────────────────
  # Stores what the apps push — see PYROSCOPE in this file's header.
  pyroscope:
    <<: *infra-defaults
    image: grafana/pyroscope:1.16.0
    container_name: pyroscope
    command:
      - -config.file=/etc/pyroscope/config.yaml
    volumes:
      - pyroscope-data:/data
      - ./config/pyroscope.yaml:/etc/pyroscope/config.yaml:ro
    # monitoring → Grafana reads it; internal → the apps push to it. Pyroscope
    # joins the apps' network rather than the apps joining `monitoring`, so an
    # app gains this one service and not alloy (docker socket) or loki.
    networks: [monitoring, internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
  monitoring:
    name: meizuno_monitoring

volumes:
  grafana-data:
    name: meizuno_grafana-data
  kuma-data:
    name: meizuno_kuma-data
  vm-data:
    name: meizuno_vm-data
  loki-data:
    name: meizuno_loki-data
  alloy-data:
    name: meizuno_alloy-data
  pyroscope-data:
    name: meizuno_pyroscope-data
