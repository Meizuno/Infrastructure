# Loki 3.x, single binary, filesystem storage. Sized for one small host: no
# object store, no ring, no microservices.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7 days. The host disk is the binding constraint, not the query range —
  # raise this only after checking `df -h /`.
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  # Lets Grafana's Logs volume / level breakdown panels work.
  volume_enabled: true
  # Loki tags every line with `detected_level` on ingest, which is what makes
  # "only warnings and errors" a single label filter instead of a regex.
  discover_log_levels: true

# retention_period above is only enforced if the compactor deletes.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h

# Powers the pattern / level breakdown in Grafana's log views.
pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
