# Pyroscope, single binary ("all" target), filesystem storage.
# NOTE: this stores profiles; the apps SEND them, each with a Pyroscope SDK
# (english and forma today). alloy's eBPF profiler would need privileged +
# pid: host, deliberately not set. See PYROSCOPE in compose.monitoring.yaml.
target: all

server:
  http_listen_port: 4040
  log_level: warn

storage:
  backend: filesystem
  filesystem:
    dir: /data

# Profiles are bulky; keep the window short on a nearly full disk.
limits:
  max_query_lookback: 72h

analytics:
  reporting_enabled: false
