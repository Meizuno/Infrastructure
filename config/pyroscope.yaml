# Pyroscope, single binary ("all" target), filesystem storage.
# NOTE: this stores profiles; the apps SEND them, each with a Pyroscope SDK
# (english, forma and money-manager today). alloy's eBPF profiler would need
# privileged + pid: host, deliberately not set. See PYROSCOPE in
# compose.monitoring.yaml.
target: all

server:
  http_listen_port: 4040
  log_level: warn

storage:
  backend: filesystem
  filesystem:
    dir: /data

# Profiles are bulky; keep the window short on a nearly full disk.
#
# Both settings, because they do different things. max_query_lookback only
# limits what a query may ask for — the blocks behind it stay on disk. The
# compactor's retention is what deletes them; it defaults to 0 (never), and
# without it /data grows until Pyroscope's own last-resort disk guard (delete
# when under 10 GiB free) kicks in, by which point Postgres is short of room
# too.
limits:
  max_query_lookback: 72h
  compactor_blocks_retention_period: 72h

analytics:
  reporting_enabled: false
