# Scrape targets for VictoriaMetrics (Prometheus format — VM reads it natively,
# so there is no Prometheus container in this stack).
# Reachability: victoria-metrics sits on monitoring + edge + internal, which is
# what lets one scraper see the exporters, traefik and cloudflared at once.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # ── the stack itself ──────────────────────────────────────────────────────
  - job_name: victoria-metrics
    static_configs:
      - targets: ["127.0.0.1:8428"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: pyroscope
    static_configs:
      - targets: ["pyroscope:4040"]

  # ── host and data stores ──────────────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── ingress ───────────────────────────────────────────────────────────────
  # Traefik serves these on its own `metrics` entrypoint (:8082), enabled in
  # traefik/traefik.yml. Nothing is published to the host, and no router points
  # at it, so it is reachable only from inside the edge network.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
  # cloudflared needs --metrics 0.0.0.0:2000 (set in compose.infra.yaml).
  - job_name: cloudflared
    static_configs:
      - targets: ["cloudflared:2000"]

  # ── apps ──────────────────────────────────────────────────────────────────
  # Each serves request durations by route plus its process CPU and memory on
  # :9000 (METRICS_PORT in its compose file) — a port no Traefik router points
  # at. DNS discovery rather than a static target: `docker rollout` runs two
  # replicas side by side, and the service name resolves to both, so each is
  # scraped as its own instance instead of the scrape flipping between them.
  # The job is named after the compose service, which is also the app's
  # service_name in Pyroscope and its service label in Loki: the Apps
  # dashboard joins the three on that one name.
  - job_name: english
    dns_sd_configs:
      - names: ["english"]
        type: A
        port: 9000
  - job_name: forma
    dns_sd_configs:
      - names: ["forma"]
        type: A
        port: 9000
  - job_name: money-manager
    dns_sd_configs:
      - names: ["money-manager"]
        type: A
        port: 9000
