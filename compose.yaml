name: meizuno

# ─────────────────────────────────────────────────────────────────────────────
# Unified stack for the meizuno ecosystem, assembled from files by concern:
#
#   compose.infra.yaml   — ingress (traefik, cloudflared), data (postgres,
#                          redis), monitoring (kuma), logs (victoria-logs, vector)
#   compose.apps.yaml    — the application services (zero-downtime rollout)
#   compose.ai-chat.yaml — ai-chat + its locally-built code-execution sandbox
#                          on an isolated (no-egress) network
#
#   Internet → Cloudflare edge → cloudflared (token) → traefik:80 → app (by Host)
#                                                                  ↘ postgres (internal)
#
# Nothing is published to the host: cloudflared reaches Traefik over the `edge`
# docker network. Traefik routes by Host header using the labels on each app.
# `docker compose` / `docker rollout` all operate on the
# whole merged project — splitting the files changes layout, not behaviour.
# ─────────────────────────────────────────────────────────────────────────────

include:
  - compose.infra.yaml
  - compose.apps.yaml
  - compose.ai-chat.yaml
