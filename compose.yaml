name: meizuno

# ─────────────────────────────────────────────────────────────────────────────
# Unified stack for the meizuno ecosystem.
#
#   Internet → Cloudflare edge → cloudflared (token) → traefik:80 → app (by Host)
#                                                                  ↘ postgres (internal)
#
# Nothing is published to the host: cloudflared reaches Traefik over the `edge`
# docker network. Traefik routes by Host header using the labels on each app.
#
# App services (authentication, ai-chat, money-manager, recipes-book, notes) are
# deployed with zero downtime via `docker rollout` (see scripts/deploy.sh). They
# therefore MUST NOT declare `container_name:` or `ports:` — docker-rollout
# transiently runs 2 replicas and Traefik load-balances across them.
# ─────────────────────────────────────────────────────────────────────────────

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [edge, internal]
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Ingress ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks: [edge]
    labels:
      - traefik.enable=true
      # Dashboard at traefik.meizuno.com, protected by basic auth
      - traefik.http.routers.dashboard.rule=Host(`traefik.meizuno.com`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [edge]
    depends_on: [traefik]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # ── Data ─────────────────────────────────────────────────────────────────-─
  postgres:
    image: postgres:18.4-bookworm
    container_name: postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=2GB
      -c max_connections=100
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SUPERUSER}
      # consumed by ./postgres/init on a FRESH volume to create the app login role + DBs
      WEB_DB_USER: ${WEB_DB_USER}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3g

  kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - kuma-data:/app/data
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.meizuno.com`)
      - traefik.http.routers.kuma.entrypoints=web
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Observability (centralized logs) ────────────────────────────────────────
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.51.0
    container_name: victoria-logs
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=30d        # storage-level rotation
    volumes:
      - vlogs-data:/vlogs
    networks: [logs, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.logs.rule=Host(`logs.meizuno.com`)
      - traefik.http.routers.logs.entrypoints=web
      - traefik.http.routers.logs.service=logs
      - traefik.http.routers.logs.middlewares=logs-auth
      - traefik.http.services.logs.loadbalancer.server.port=9428
      - traefik.http.middlewares.logs-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  vector:
    image: timberio/vector:0.56.0-alpine
    container_name: vector
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    networks: [logs]
    depends_on: [victoria-logs]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ── Apps (zero-downtime via docker rollout — no container_name / ports!) ─────
  authentication:
    <<: *app-defaults
    image: ghcr.io/meizuno/authentication:latest
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${WEB_DB_USER}:${WEB_DB_PASSWORD}@postgres:5432/authentication
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://auth.meizuno.com/google/callback
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      GIN_MODE: release
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.meizuno.com`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  ai-chat:
    <<: *app-defaults
    image: ghcr.io/meizuno/ai-chat:latest
    environment:
      NUXT_OPENAI_API_KEY: ${OPENAI_API_KEY}
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_DATABASE_URL: postgres://${WEB_DB_USER}:${WEB_DB_PASSWORD}@postgres:5432/chat
      NUXT_MCP_API_KEY: ${MCP_API_KEY}
    volumes:
      - ./config/ai-chat.yml:/app/config.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai-chat.rule=Host(`chat.meizuno.com`)
      - traefik.http.routers.ai-chat.entrypoints=web
      - traefik.http.services.ai-chat.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  money-manager:
    <<: *app-defaults
    image: ghcr.io/meizuno/money-manager:latest
    environment:
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_DATABASE_URL: postgres://${WEB_DB_USER}:${WEB_DB_PASSWORD}@postgres:5432/money_manager
      NUXT_MCP_API_KEY: ${MCP_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.http.routers.money-manager.rule=Host(`money.meizuno.com`)
      - traefik.http.routers.money-manager.entrypoints=web
      - traefik.http.services.money-manager.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  recipes-book:
    <<: *app-defaults
    image: ghcr.io/meizuno/recipes-book:latest
    environment:
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_DATABASE_URL: postgres://${WEB_DB_USER}:${WEB_DB_PASSWORD}@postgres:5432/recipes_book
      NUXT_MCP_API_KEY: ${MCP_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.http.routers.recipes-book.rule=Host(`recipes.meizuno.com`)
      - traefik.http.routers.recipes-book.entrypoints=web
      - traefik.http.services.recipes-book.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  notes:
    <<: *app-defaults
    image: ghcr.io/meizuno/notes:latest
    environment:
      NUXT_AUTH_SERVICE_URL: http://authentication:8080
      NUXT_DATABASE_URL: postgres://${WEB_DB_USER}:${WEB_DB_PASSWORD}@postgres:5432/notes
      NUXT_MCP_API_KEY: ${MCP_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.http.routers.notes.rule=Host(`notes.meizuno.com`)
      - traefik.http.routers.notes.entrypoints=web
      - traefik.http.services.notes.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
  logs:
    name: meizuno_logs

volumes:
  postgres-data:
  kuma-data:
  vlogs-data:
