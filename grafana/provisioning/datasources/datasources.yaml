# Datasources as code — committed, so a rebuilt Grafana comes back wired up.
# Edits here win over anything clicked in the UI on restart.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    # VictoriaMetrics speaks the Prometheus API, so the prometheus plugin is the
    # right driver — no extra plugin to install.
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040

  # Uptime Kuma's SQLite file, mounted read-only into Grafana
  # (compose.monitoring.yaml) and opened read-only here too. Feeds the
  # overview's uptime row: the monitors' current state and their status
  # changes with Kuma's own messages.
  - name: Uptime Kuma
    uid: kuma
    type: frser-sqlite-datasource
    access: proxy
    jsonData:
      path: /var/lib/kuma/kuma.db
      pathPrefix: "file:"
      pathOptions: "?mode=ro"
