<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 740" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .card { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; }
      .name { fill:#0f172a; font-size:14px; font-weight:600; }
      .sub  { fill:#64748b; font-size:11px; }
      .tag  { fill:#94a3b8; font-size:10.5px; }
      .flow { stroke:#94a3b8; stroke-width:1.6; fill:none; }
      .lbl  { fill:#94a3b8; font-size:10.5px; letter-spacing:.14em; }
      .h1   { fill:#0f172a; font-size:17px; font-weight:800; }
      .h1a  { fill:#10b981; font-size:17px; font-weight:800; }
    </style>
  </defs>

  <!-- title -->
  <text x="28" y="34" class="h1">meizuno <tspan class="h1a">infrastructure</tspan></text>
  <text x="28" y="52" class="sub">One Docker Compose stack · Cloudflare-fronted · zero-downtime deploys</text>

  <!-- ── Ingress chain ─────────────────────────────────────────────── -->
  <text x="28" y="86" class="lbl">INGRESS</text>
  <!-- Internet -->
  <rect class="card" x="28"  y="96" width="150" height="52" rx="12"/>
  <text x="103" y="120" text-anchor="middle" class="name">🌐 Internet</text>
  <text x="103" y="137" text-anchor="middle" class="tag">public traffic</text>
  <!-- Cloudflare -->
  <rect class="card" x="210" y="96" width="184" height="52" rx="12"/>
  <rect x="210" y="96" width="4" height="52" rx="2" fill="#f38020"/>
  <text x="302" y="118" text-anchor="middle" class="name">Cloudflare edge</text>
  <text x="302" y="135" text-anchor="middle" class="tag">DNS · WAF · Zero-Trust Access</text>
  <!-- cloudflared -->
  <rect class="card" x="426" y="96" width="156" height="52" rx="12"/>
  <rect x="426" y="96" width="4" height="52" rx="2" fill="#f38020"/>
  <text x="504" y="118" text-anchor="middle" class="name">cloudflared</text>
  <text x="504" y="135" text-anchor="middle" class="tag">outbound tunnel</text>
  <!-- Traefik -->
  <rect class="card" x="614" y="96" width="156" height="52" rx="12"/>
  <rect x="614" y="96" width="4" height="52" rx="2" fill="#24a1c1"/>
  <text x="692" y="118" text-anchor="middle" class="name">Traefik</text>
  <text x="692" y="135" text-anchor="middle" class="tag">host-based routing</text>

  <path class="flow" d="M178 122 H208"   marker-end="url(#arrow)"/>
  <path class="flow" d="M394 122 H424"   marker-end="url(#arrow)"/>
  <path class="flow" d="M582 122 H612"   marker-end="url(#arrow)"/>

  <!-- ── Apps ──────────────────────────────────────────────────────── -->
  <text x="28" y="188" class="lbl">SERVICES</text>
  <rect x="28" y="200" width="812" height="212" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="46" y="226" class="sub">Shared cookie-SSO — every app validates tokens at <tspan fill="#6366f1" font-weight="600">Authentication</tspan></text>

  <!-- Traefik → apps -->
  <path class="flow" d="M692 148 V174 H434 V200" marker-end="url(#arrow)"/>

  <!-- row helper: 3 cols x 2 rows -->
  <!-- col x: 46, 316, 586 ; w 248 ; row y: 240, 320 ; h 64 -->
  <!-- authentication -->
  <rect class="card" x="46"  y="240" width="248" height="64" rx="12"/>
  <circle cx="66" cy="266" r="5" fill="#6366f1"/>
  <text x="82" y="264" class="name">Authentication</text>
  <text x="82" y="284" class="tag">Go · Gin · JWT + refresh · Google OAuth</text>
  <!-- ai-chat -->
  <rect class="card" x="316" y="240" width="248" height="64" rx="12"/>
  <circle cx="336" cy="266" r="5" fill="#8b5cf6"/>
  <text x="352" y="264" class="name">AI Chat</text>
  <text x="352" y="284" class="tag">Nuxt · OpenAI · MCP hub</text>
  <!-- money-manager -->
  <rect class="card" x="586" y="240" width="238" height="64" rx="12"/>
  <circle cx="606" cy="266" r="5" fill="#10b981"/>
  <text x="622" y="264" class="name">Money Manager</text>
  <text x="622" y="284" class="tag">Nuxt · Prisma · MCP</text>
  <!-- recipes-book -->
  <rect class="card" x="46"  y="320" width="248" height="64" rx="12"/>
  <circle cx="66" cy="346" r="5" fill="#f59e0b"/>
  <text x="82" y="344" class="name">Recipes Book</text>
  <text x="82" y="364" class="tag">Nuxt · Prisma · MCP</text>
  <!-- notes -->
  <rect class="card" x="316" y="320" width="248" height="64" rx="12"/>
  <circle cx="336" cy="346" r="5" fill="#38bdf8"/>
  <text x="352" y="344" class="name">Notes</text>
  <text x="352" y="364" class="tag">Nuxt · Prisma · MCP</text>
  <!-- calories -->
  <rect class="card" x="586" y="320" width="238" height="64" rx="12"/>
  <circle cx="606" cy="346" r="5" fill="#14b8a6"/>
  <text x="622" y="344" class="name">Calories</text>
  <text x="622" y="364" class="tag">Go · chi · sqlc + Vue SPA</text>

  <!-- ── Postgres ──────────────────────────────────────────────────── -->
  <text x="912" y="188" class="lbl" text-anchor="middle">DATA</text>
  <g>
    <ellipse cx="912" cy="228" rx="66" ry="16" fill="#ffffff" stroke="#336791" stroke-width="1.5"/>
    <path d="M846 228 V300 A66 16 0 0 0 978 300 V228" fill="#ffffff" stroke="#336791" stroke-width="1.5"/>
    <ellipse cx="912" cy="228" rx="66" ry="16" fill="#eff4f9" stroke="#336791" stroke-width="1.5"/>
    <text x="912" y="270" text-anchor="middle" class="name">PostgreSQL 18</text>
    <text x="912" y="288" text-anchor="middle" class="tag">role + DB per app</text>
  </g>
  <path class="flow" d="M840 300 H912 V318" marker-end="url(#arrow)"/>
  <text x="836" y="326" text-anchor="end" class="tag">pgx / Prisma</text>

  <!-- ── Operations band ───────────────────────────────────────────── -->
  <text x="28" y="452" class="lbl">OPERATIONS</text>
  <!-- 4 tiles: x 28,286,544,802 ; w 246 ; y 462 ; h 150 -->
  <g>
    <rect class="card" x="28"  y="462" width="230" height="150" rx="14"/>
    <text x="46" y="490" class="name">🔭 Observability</text>
    <text x="46" y="514" class="sub">Vector → <tspan fill="#621773" font-weight="600">VictoriaLogs</tspan> logs</text>
    <text x="46" y="534" class="sub"><tspan fill="#0ea5e9" font-weight="600">Beszel</tspan> CPU / RAM / disk metrics</text>
    <text x="46" y="558" class="sub"><tspan fill="#5cdd8b" font-weight="600">Uptime&#160;Kuma</tspan> status page</text>
    <text x="46" y="582" class="tag">+ push alerts</text>
  </g>
  <g>
    <rect class="card" x="286" y="462" width="230" height="150" rx="14"/>
    <text x="304" y="492" class="name">💾 Backups</text>
    <text x="304" y="518" class="sub">nightly pg_dumpall →</text>
    <text x="304" y="534" class="sub">age-encrypted → <tspan fill="#f38020" font-weight="600">R2</tspan></text>
    <text x="304" y="560" class="sub">restore auto-verified</text>
    <text x="304" y="586" class="tag">30-object retention</text>
  </g>
  <g>
    <rect class="card" x="544" y="462" width="230" height="150" rx="14"/>
    <text x="562" y="492" class="name">🚀 Delivery</text>
    <text x="562" y="518" class="sub">GitHub Actions → GHCR</text>
    <text x="562" y="534" class="sub">→ <tspan fill="#2496ed" font-weight="600">docker rollout</tspan></text>
    <text x="562" y="560" class="sub">health-gated cutover</text>
    <text x="562" y="586" class="tag">zero downtime</text>
  </g>
  <g>
    <rect class="card" x="802" y="462" width="230" height="150" rx="14"/>
    <text x="820" y="492" class="name">🔐 Secrets</text>
    <text x="820" y="518" class="sub"><tspan fill="#10b981" font-weight="600">SOPS</tspan> + age</text>
    <text x="820" y="534" class="sub">encrypted at rest in git</text>
    <text x="820" y="560" class="sub">EdDSA JWT signing key</text>
    <text x="820" y="586" class="tag">as a file secret</text>
  </g>

  <!-- Postgres → backups (data protection) -->
  <path d="M912 316 V430 H401 V462" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#arrow)"/>

  <!-- ── Tooling band (edge-gated internal UIs) ─────────────────────── -->
  <text x="28" y="648" class="lbl">TOOLING</text>
  <text x="1032" y="648" text-anchor="end" class="tag">🔒 behind Cloudflare Access</text>
  <!-- Homepage -->
  <rect class="card" x="28" y="658" width="488" height="64" rx="12"/>
  <circle cx="48" cy="684" r="5" fill="#38bdf8"/>
  <text x="64" y="682" class="name">Homepage</text>
  <text x="64" y="702" class="tag">single landing page · host CPU/RAM/disk · app up/down</text>
  <!-- Code-Server -->
  <rect class="card" x="544" y="658" width="488" height="64" rx="12"/>
  <circle cx="564" cy="684" r="5" fill="#2496ed"/>
  <text x="580" y="682" class="name">Code Server</text>
  <text x="580" y="702" class="tag">browser VS Code · rootless Docker-in-Docker</text>
</svg>
