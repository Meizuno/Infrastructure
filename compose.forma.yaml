# Forma — a self-contained calorie tracker (Go API + Vite SPA in one image),
# built as ghcr.io/meizuno/forma and served at forma.meizuno.com. Renamed from
# `calories` throughout: service, image, DB + role, env keys and secrets file.
# The ONLY thing still named calories is the old public host, kept alive as a
# 301 to forma.meizuno.com (labels below). An existing cluster needs
# scripts/rename-calories-to-forma.sh run once before this is deployed — the
# Postgres database and role are renamed, and postgres/init only runs on a
# fresh volume.
# It runs its OWN Google OAuth and signs its OWN HS256 access tokens (migrated
# off the central meizuno SSO), so it needs GOOGLE_* + JWT_SECRET rather than the
# auth-service delegation vars, and its cookies are host-only (forma.meizuno.com
# — which is why exactly ONE host serves the app and the old one redirects).
# Assembled into the `meizuno` project via compose.yaml (include:). Anchors are
# file-scoped in YAML, so the app defaults are declared here too.

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [edge, internal]
  stop_grace_period: 25s
  depends_on:
    postgres:
      condition: service_healthy

services:
  forma:
    <<: *app-defaults
    image: ghcr.io/meizuno/forma:latest
    environment:
      PORT: 8080
      # The DB password is shared with Postgres role creation (postgres/init
      # reads FORMA_DB_PASSWORD too), so it stays in the main .env.
      DATABASE_URL: postgres://forma_user:${FORMA_DB_PASSWORD}@postgres:5432/forma?sslmode=disable
      # Public URL, not a secret — must match Forma's Google OAuth client
      # exactly. Add this URI to the client BEFORE deploying (see
      # forma.env.example); the old calories.meizuno.com one can be dropped
      # once traffic has moved.
      GOOGLE_REDIRECT_URL: https://forma.meizuno.com/api/auth/google/callback
      # Continuous CPU + memory profiles → Pyroscope (compose.monitoring.yaml),
      # shown in Grafana as service `forma`. Reached over `internal`; unset = off.
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      # Prometheus metrics (request durations by route, process CPU and memory)
      # on a port of their own. No Traefik label points at it and nothing is
      # published, so only containers on the same networks reach it — which is
      # where victoria-metrics scrapes it from.
      METRICS_PORT: "9000"
    # Migrations run on boot, so a deploy carries its own schema:
    #
    #   docker compose pull forma && docker rollout forma
    #
    # `docker rollout` brings the new container up beside the old one, so the
    # new version migrates while the previous one is still serving. Fine for
    # a column. For a migration that rewrites a large table, deploy that one
    # with RUN_MIGRATIONS=false and run it when it suits:
    #
    #   docker compose run --rm forma python scripts/migrate.py --check
    #   docker compose run --rm forma python scripts/migrate.py
    #
    # `run --rm` is a throwaway container from the NEW image, which is the
    # only one carrying the new migration files; `exec` would reach the old.
    #
    # The PRODUCT catalogue is a different thing and is never automatic.
    # The dump lives on the host and is mounted in; the container has no
    # /data of its own:
    #
    #   docker compose run --rm --label traefik.enable=false \
    #       -v /srv/forma/off.csv.gz:/data/off.csv.gz:ro \
    #       forma python scripts/import_products.py \
    #           --dump /data/off.csv.gz --dry-run
    #
    # `run` and not `exec`, so a nine-gigabyte read does not share the 512 MB
    # and the two cores that are serving people. And traefik.enable=false,
    # because a one-off container inherits the labels below — without it
    # Traefik adds it to the load balancer for forma.meizuno.com and a share
    # of real requests lands on a container running a Python script.
    #
    # Self-contained auth secrets (its own Google OAuth + its own HS256 signing)
    # live in their OWN SOPS-managed file, apart from the shared stack secrets.
    # env_file injects them into the container with their real names
    # (JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET). Materialize it with
    # `./scripts/secrets.sh decrypt` (see forma.env.example).
    env_file:
      - forma.env
    labels:
      - traefik.enable=true
      # Canonical host.
      - traefik.http.routers.forma.rule=Host(`forma.meizuno.com`)
      - traefik.http.routers.forma.entrypoints=web
      # Legacy host → permanent redirect, so old bookmarks and any link still
      # pointing at calories.meizuno.com keep working. The middleware answers
      # the request itself, so this router never reaches the backend. `$${1}` is
      # escaped for compose interpolation — Traefik must receive `${1}`.
      - traefik.http.routers.forma-legacy.rule=Host(`calories.meizuno.com`)
      - traefik.http.routers.forma-legacy.entrypoints=web
      - traefik.http.routers.forma-legacy.middlewares=forma-legacy-host
      - traefik.http.middlewares.forma-legacy-host.redirectregex.regex=^https?://calories\.meizuno\.com/(.*)
      - traefik.http.middlewares.forma-legacy-host.redirectregex.replacement=https://forma.meizuno.com/$${1}
      - traefik.http.middlewares.forma-legacy-host.redirectregex.permanent=true
      - traefik.http.services.forma.loadbalancer.server.port=8080
    # Measured rather than guessed. The image was built and run against a
    # seeded diary (60 days, ~1000 entries) while its own request log was
    # read back: 72 MB resident idle, 94 MB at the peak of sixteen concurrent
    # clients, and one core saturated the whole time. Against the old 128 MB
    # that peak was 73% of the limit with nothing left for a bad day, and the
    # old 0.25 CPU was a quarter of the core the process actually wanted.
    #
    # 2 CPUs is room for a second uvicorn worker, which is what buys anything
    # here: one worker is one event loop on one core, and every read waits
    # behind it. Two workers measured 40-60% more requests a second on the
    # read endpoints (day, foods, templates, measurements) and cost 206 MB
    # between them, which is why the memory goes up with the CPU rather than
    # instead of it. NOTE: the app still starts one worker — WEB_CONCURRENCY
    # is what spends the second core, and it is not set here yet.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
