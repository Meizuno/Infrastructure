name: validate

on:
  push:
    paths:
      - "compose*.yaml"
      - ".env.example"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "compose*.yaml"
      - ".env.example"
      - ".github/workflows/validate.yml"

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yaml
        # docker compose is preinstalled on ubuntu runners.
        # --env-file resolves ${...} interpolation; -q validates without output.
        #
        # The per-app `env_file:` targets (forma.env, ...) are gitignored — they
        # are SOPS-derived on the host — and compose refuses to PARSE a project
        # whose env_file is missing, so stand each one in from its committed
        # example first. Same substitution as --env-file .env.example does for
        # the shared vars.
        run: |
          for example in *.env.example; do cp "$example" "${example%.example}"; done
          docker compose --env-file .env.example config -q
