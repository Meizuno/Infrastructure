# calories — a self-contained calorie tracker (Go API + Vite SPA in one image).
# It runs its OWN Google OAuth and signs its OWN HS256 access tokens (migrated
# off the central meizuno SSO), so it needs GOOGLE_* + JWT_SECRET rather than the
# auth-service delegation vars, and its cookies are host-only (calories.meizuno.com).
# Assembled into the `meizuno` project via compose.yaml (include:). Anchors are
# file-scoped in YAML, so the app defaults are declared here too.

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [edge, internal]
  stop_grace_period: 25s
  depends_on:
    postgres:
      condition: service_healthy

services:
  calories:
    <<: *app-defaults
    image: ghcr.io/meizuno/calories:latest
    environment:
      PORT: 8080
      # The DB password is shared with Postgres role creation (postgres/init
      # reads CALORIES_DB_PASSWORD too), so it stays in the main .env.
      DATABASE_URL: postgres://calories_user:${CALORIES_DB_PASSWORD}@postgres:5432/calories?sslmode=disable
      # Public URL, not a secret — must match calories' Google OAuth client exactly.
      GOOGLE_REDIRECT_URL: https://calories.meizuno.com/api/auth/google/callback
    # Self-contained auth secrets (its own Google OAuth + its own HS256 signing)
    # live in their OWN SOPS-managed file, apart from the shared stack secrets.
    # env_file injects them into the container with their real names
    # (JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET). Materialize it with
    # `./scripts/secrets.sh decrypt` (see calories.env.example).
    env_file:
      - calories.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.calories.rule=Host(`calories.meizuno.com`)
      - traefik.http.routers.calories.entrypoints=web
      - traefik.http.services.calories.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  edge:
    name: meizuno_edge
  internal:
    name: meizuno_internal
